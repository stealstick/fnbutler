substitutions:
  _REGION: asia-northeast3
  _SERVICE: fnbutler
  _DB_BUCKET: protein-test-469413-fnbutler

steps:
  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        mkdir -p butler/db
        gsutil cp "gs://${_DB_BUCKET}/butler.db" butler/db/butler.db

  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -t
      - asia-northeast3-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/fnbutler:$BUILD_ID
      - butler

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - asia-northeast3-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/fnbutler:$BUILD_ID

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image
      - asia-northeast3-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/fnbutler:$BUILD_ID
      - --region
      - ${_REGION}
      - --allow-unauthenticated
      - --memory
      - 512Mi
      - --cpu
      - "1"
      - --min-instances
      - "0"
      - --max-instances
      - "1"
      - --set-env-vars
      - BUTLER_DB_PATH=/app/db/butler.db,BUTLER_BASE_URL=https://fnbutler-765232817913.asia-northeast3.run.app

images:
  - asia-northeast3-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/fnbutler:$BUILD_ID
