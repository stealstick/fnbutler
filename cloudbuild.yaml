substitutions:
  _REGION: asia-northeast3
  _SERVICE: fnbutler
  _SQL_INSTANCE: fnbutler-pg
  _DB_NAME: butler
  _DB_USER: butler
  _DB_PASSWORD_SECRET: fnbutler-db-password
  _RUN_SA: fnbutler-runner
  _BASE_URL: https://fnbutler-l3why3suea-du.a.run.app

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --target
      - runner
      - -t
      - asia-northeast3-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/fnbutler:$BUILD_ID
      - butler

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - asia-northeast3-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/fnbutler:$BUILD_ID

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -ceu
      - |
        gcloud run deploy "${_SERVICE}" \
          --image "asia-northeast3-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/fnbutler:$BUILD_ID" \
          --region "${_REGION}" \
          --allow-unauthenticated \
          --memory 512Mi \
          --cpu 1 \
          --min-instances 0 \
          --max-instances 2 \
          --port 8080 \
          --service-account "${_RUN_SA}@$PROJECT_ID.iam.gserviceaccount.com" \
          --set-cloudsql-instances "$PROJECT_ID:${_REGION}:${_SQL_INSTANCE}" \
          --set-env-vars "PGHOST=/cloudsql/$PROJECT_ID:${_REGION}:${_SQL_INSTANCE},PGDATABASE=${_DB_NAME},PGUSER=${_DB_USER},BUTLER_USERSTORE=firestore,BUTLER_BASE_URL=${_BASE_URL},BUTLER_RATE_PER_MIN=80" \
          --set-secrets "PGPASSWORD=${_DB_PASSWORD_SECRET}:latest"

images:
  - asia-northeast3-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/fnbutler:$BUILD_ID
