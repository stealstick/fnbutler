name: run refresh job

# Production refresh is scheduled by Cloud Scheduler or GitHub Actions against the Cloud Run Job.
# This workflow is also a manual escape hatch for re-running that same job from GitHub.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "refresh mode"
        type: choice
        default: full
        options: [full, calendar-only, dart-2024-financials]
      wait:
        description: "wait for job completion"
        type: boolean
        default: true
  schedule:
    # Saturdays 08:00 KST.
    - cron: "0 23 * * 5"

env:
  PROJECT: protein-test-469413
  REGION: asia-northeast3
  JOB: fnbutler-refresh
  CALENDAR_JOB: fnbutler-calendar-refresh

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Execute Cloud Run refresh job
        env:
          EVENT_NAME: ${{ github.event_name }}
          MODE: ${{ github.event.inputs.mode || 'full' }}
          WAIT: ${{ github.event.inputs.wait || 'true' }}
        run: |
          WAIT_FLAG="--wait"
          if [ "$WAIT" != "true" ]; then
            WAIT_FLAG="--async"
          fi

          TARGET_JOB="$JOB"
          EXTRA_ARGS=()
          if [ "$EVENT_NAME" = "schedule" ] || [ "$MODE" = "calendar-only" ]; then
            TARGET_JOB="$CALENDAR_JOB"
          fi
          if [ "$MODE" = "dart-2024-financials" ]; then
            EXTRA_ARGS=(--args tsx,scripts/backfill-dart-financials.ts,--year,2024)
          fi

          gcloud run jobs execute "$TARGET_JOB" \
            --project "$PROJECT" \
            --region "$REGION" \
            "${EXTRA_ARGS[@]}" \
            $WAIT_FLAG
