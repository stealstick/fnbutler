name: run refresh job

# Production refresh is scheduled by Cloud Scheduler or GitHub Actions against the Cloud Run Job.
# This workflow is also a manual escape hatch for re-running that same job from GitHub.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "refresh mode"
        type: choice
        default: full
        options: [full, calendar-only, dart-financials, dart-2024-financials, dart-2025-financials, wisereport-estimates, nasdaq-companies, fmp-nasdaq-estimates, seekingalpha-nasdaq-estimates, yahoo-nasdaq-estimates]
      wait:
        description: "wait for job completion"
        type: boolean
        default: true
  schedule:
    # Daily 18:30 KST.
    - cron: "30 9 * * *"
    # Saturdays 08:00 KST.
    - cron: "0 23 * * 5"

env:
  PROJECT: protein-test-469413
  REGION: asia-northeast3
  JOB: fnbutler-refresh
  CALENDAR_JOB: fnbutler-calendar-refresh

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Execute Cloud Run refresh job
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule || '' }}
          MODE: ${{ github.event.inputs.mode || 'full' }}
          WAIT: ${{ github.event.inputs.wait || 'true' }}
        run: |
          WAIT_FLAG="--wait"
          if [ "$WAIT" != "true" ]; then
            WAIT_FLAG="--async"
          fi

          TARGET_JOB="$JOB"
          EXTRA_ARGS=()
          if { [ "$EVENT_NAME" = "schedule" ] && [ "$SCHEDULE" = "0 23 * * 5" ]; } || [ "$MODE" = "calendar-only" ]; then
            TARGET_JOB="$CALENDAR_JOB"
          fi
          if [ "$MODE" = "dart-financials" ]; then
            EXTRA_ARGS=(--args tsx,scripts/backfill-dart-financials.ts,--latest)
          fi
          if [ "$MODE" = "dart-2024-financials" ]; then
            EXTRA_ARGS=(--args tsx,scripts/backfill-dart-financials.ts,--year,2024)
          fi
          if [ "$MODE" = "dart-2025-financials" ]; then
            EXTRA_ARGS=(--args tsx,scripts/backfill-dart-financials.ts,--year,2025)
          fi
          if [ "$MODE" = "wisereport-estimates" ]; then
            EXTRA_ARGS=(--args tsx,scripts/backfill-wisereport-estimates.ts)
          fi
          if [ "$MODE" = "nasdaq-companies" ]; then
            EXTRA_ARGS=(--args tsx,scripts/ingest-nasdaq.ts)
          fi
          if [ "$MODE" = "fmp-nasdaq-estimates" ]; then
            EXTRA_ARGS=(--args tsx,scripts/backfill-fmp-nasdaq-estimates.ts)
          fi
          if [ "$MODE" = "seekingalpha-nasdaq-estimates" ]; then
            EXTRA_ARGS=(--args tsx,scripts/backfill-seekingalpha-nasdaq-estimates.ts)
          fi
          if [ "$MODE" = "yahoo-nasdaq-estimates" ]; then
            EXTRA_ARGS=(--args tsx,scripts/backfill-yahoo-nasdaq-estimates.ts)
          fi

          gcloud run jobs execute "$TARGET_JOB" \
            --project "$PROJECT" \
            --region "$REGION" \
            "${EXTRA_ARGS[@]}" \
            $WAIT_FLAG
