name: run refresh job

# Production refresh is scheduled by Cloud Scheduler against the Cloud Run Job.
# This workflow is a manual escape hatch for re-running that same job from GitHub.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "refresh mode"
        type: choice
        default: full
        options: [full, calendar-only, dart-financials, dart-2024-financials, dart-2025-financials, fnguide-estimates, wisereport-estimates, nasdaq-companies, fmp-nasdaq-estimates, seekingalpha-nasdaq-estimates, yahoo-nasdaq-estimates, stockanalysis-nasdaq-estimates, us-target-monthly, company-news]
      wait:
        description: "wait for job completion"
        type: boolean
        default: true
      fnguide_estimate_limit:
        description: "optional FnGuide estimate company limit"
        type: string
        required: false
      stockanalysis_limit:
        description: "optional StockAnalysis symbol limit for manual runs"
        type: string
        required: false
      stockanalysis_symbol:
        description: "optional StockAnalysis single symbol for manual runs"
        type: string
        required: false
      stockanalysis_call_delay_ms:
        description: "optional StockAnalysis delay between symbols"
        type: string
        required: false
      stockanalysis_jitter_ms:
        description: "optional StockAnalysis delay jitter"
        type: string
        required: false
env:
  PROJECT: protein-test-469413
  REGION: asia-northeast3
  JOB: fnbutler-refresh
  CALENDAR_JOB: fnbutler-calendar-refresh
  STOCKANALYSIS_JOB: fnbutler-stockanalysis-backfill
  NEWS_JOB: fnbutler-news-refresh

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Execute Cloud Run refresh job
        env:
          MODE: ${{ github.event.inputs.mode || 'full' }}
          WAIT: ${{ github.event.inputs.wait || 'true' }}
          FNGUIDE_ESTIMATE_LIMIT: ${{ github.event.inputs.fnguide_estimate_limit || '' }}
          STOCKANALYSIS_LIMIT: ${{ github.event.inputs.stockanalysis_limit || '' }}
          STOCKANALYSIS_SYMBOL: ${{ github.event.inputs.stockanalysis_symbol || '' }}
          STOCKANALYSIS_CALL_DELAY_MS: ${{ github.event.inputs.stockanalysis_call_delay_ms || '' }}
          STOCKANALYSIS_JITTER_MS: ${{ github.event.inputs.stockanalysis_jitter_ms || '' }}
        run: |
          WAIT_FLAG="--wait"
          if [ "$WAIT" != "true" ]; then
            WAIT_FLAG="--async"
          fi

          TARGET_JOB="$JOB"
          EXTRA_ARGS=()
          if [ "$MODE" = "calendar-only" ]; then
            TARGET_JOB="$CALENDAR_JOB"
          fi
          if [ "$MODE" = "stockanalysis-nasdaq-estimates" ]; then
            TARGET_JOB="$STOCKANALYSIS_JOB"
            if [ -n "$STOCKANALYSIS_LIMIT" ]; then
              STOCKANALYSIS_ARGS="tsx,scripts/backfill-stockanalysis-nasdaq-estimates.ts,--limit,${STOCKANALYSIS_LIMIT}"
              if [ -n "$STOCKANALYSIS_SYMBOL" ]; then
                STOCKANALYSIS_ARGS="${STOCKANALYSIS_ARGS},--symbol,${STOCKANALYSIS_SYMBOL}"
              fi
              if [ -n "$STOCKANALYSIS_CALL_DELAY_MS" ]; then
                STOCKANALYSIS_ARGS="${STOCKANALYSIS_ARGS},--call-delay-ms,${STOCKANALYSIS_CALL_DELAY_MS}"
              fi
              if [ -n "$STOCKANALYSIS_JITTER_MS" ]; then
                STOCKANALYSIS_ARGS="${STOCKANALYSIS_ARGS},--jitter-ms,${STOCKANALYSIS_JITTER_MS}"
              fi
              EXTRA_ARGS=(--args "$STOCKANALYSIS_ARGS")
            fi
          fi
          if [ "$MODE" = "company-news" ]; then
            TARGET_JOB="$NEWS_JOB"
          fi
          if [ "$MODE" = "us-target-monthly" ]; then
            US_TM_ARGS="tsx,scripts/backfill-us-target-monthly.ts"
            if [ -n "$STOCKANALYSIS_LIMIT" ]; then
              US_TM_ARGS="${US_TM_ARGS},--limit,${STOCKANALYSIS_LIMIT}"
            fi
            if [ -n "$STOCKANALYSIS_SYMBOL" ]; then
              US_TM_ARGS="${US_TM_ARGS},--symbol,${STOCKANALYSIS_SYMBOL}"
            fi
            EXTRA_ARGS=(--args "$US_TM_ARGS")
          fi
          if [ "$MODE" = "dart-financials" ]; then
            EXTRA_ARGS=(--args tsx,scripts/backfill-dart-financials.ts,--latest)
          fi
          if [ "$MODE" = "dart-2024-financials" ]; then
            EXTRA_ARGS=(--args tsx,scripts/backfill-dart-financials.ts,--year,2024)
          fi
          if [ "$MODE" = "dart-2025-financials" ]; then
            EXTRA_ARGS=(--args tsx,scripts/backfill-dart-financials.ts,--year,2025)
          fi
          if [ "$MODE" = "fnguide-estimates" ]; then
            FNGUIDE_ARGS="tsx,scripts/backfill-fnguide-estimates.ts"
            if [ -n "$FNGUIDE_ESTIMATE_LIMIT" ]; then
              FNGUIDE_ARGS="${FNGUIDE_ARGS},--limit,${FNGUIDE_ESTIMATE_LIMIT}"
            fi
            EXTRA_ARGS=(--args "$FNGUIDE_ARGS")
          fi
          if [ "$MODE" = "wisereport-estimates" ]; then
            EXTRA_ARGS=(--args tsx,scripts/backfill-wisereport-estimates.ts)
          fi
          if [ "$MODE" = "nasdaq-companies" ]; then
            EXTRA_ARGS=(--args tsx,scripts/ingest-nasdaq.ts)
          fi
          if [ "$MODE" = "fmp-nasdaq-estimates" ]; then
            EXTRA_ARGS=(--args tsx,scripts/backfill-fmp-nasdaq-estimates.ts)
          fi
          if [ "$MODE" = "seekingalpha-nasdaq-estimates" ]; then
            EXTRA_ARGS=(--args tsx,scripts/backfill-seekingalpha-nasdaq-estimates.ts)
          fi
          if [ "$MODE" = "yahoo-nasdaq-estimates" ]; then
            EXTRA_ARGS=(--args tsx,scripts/backfill-yahoo-nasdaq-estimates.ts)
          fi

          gcloud run jobs execute "$TARGET_JOB" \
            --project "$PROJECT" \
            --region "$REGION" \
            "${EXTRA_ARGS[@]}" \
            $WAIT_FLAG
