name: run refresh job

# Production refresh is scheduled by Cloud Scheduler against the Cloud Run Job.
# This workflow is a manual escape hatch for re-running that same job from GitHub.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "refresh mode"
        type: choice
        default: full
        options: [full, calendar-only]
      wait:
        description: "wait for job completion"
        type: boolean
        default: true

env:
  PROJECT: protein-test-469413
  REGION: asia-northeast3
  JOB: fnbutler-refresh

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Execute Cloud Run refresh job
        run: |
          WAIT_FLAG="--wait"
          if [ "${{ github.event.inputs.wait }}" != "true" ]; then
            WAIT_FLAG="--async"
          fi

          ARGS_FLAG=""
          if [ "${{ github.event.inputs.mode }}" = "calendar-only" ]; then
            ARGS_FLAG="--args=tsx,scripts/refresh-daily.ts,--calendar-only"
          fi

          gcloud run jobs execute "$JOB" \
            --project "$PROJECT" \
            --region "$REGION" \
            $WAIT_FLAG \
            $ARGS_FLAG
