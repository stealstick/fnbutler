name: deploy butler.view

on:
  push:
    branches: [main]
    paths:
      - "butler/**"
      - "!butler/**/*.md"
      - "cloudbuild.yaml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}

env:
  PROJECT: protein-test-469413
  REGION: asia-northeast3
  SERVICE: fnbutler
  JOB: fnbutler-refresh
  SCHEDULER_JOB: fnbutler-refresh-weekdays
  CALENDAR_JOB: fnbutler-calendar-refresh
  CALENDAR_SCHEDULER_JOB: fnbutler-calendar-weekly
  STOCKANALYSIS_JOB: fnbutler-stockanalysis-backfill
  STOCKANALYSIS_SCHEDULER_JOB: fnbutler-stockanalysis-backfill-6h
  SQL_INSTANCE: fnbutler-pg
  DB_NAME: butler
  DB_USER: butler
  DB_PASSWORD_SECRET: fnbutler-db-password
  RUN_SA: fnbutler-runner
  URL: https://fnbutler-l3why3suea-du.a.run.app
  SEEKING_ALPHA_NASDAQ_LIMIT: "500"
  SEEKING_ALPHA_BATCH_SIZE: "5"
  SEEKING_ALPHA_CALL_DELAY_MS: "60000"
  SEEKING_ALPHA_USE_CURL: "1"
  STOCKANALYSIS_NASDAQ_LIMIT: "12"
  STOCKANALYSIS_CALL_DELAY_MS: "7000"
  STOCKANALYSIS_JITTER_MS: "3000"
  STOCKANALYSIS_BROKER_TARGETS: "1"

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Check optional runtime secrets
        env:
          DART_API_KEY_VALUE: ${{ secrets.DART_API_KEY }}
          FMP_API_KEY_VALUE: ${{ secrets.FMP_API_KEY }}
          YAHOO_COOKIE_VALUE: ${{ secrets.YAHOO_COOKIE }}
          YAHOO_CRUMB_VALUE: ${{ secrets.YAHOO_CRUMB }}
        run: |
          if [ -n "$DART_API_KEY_VALUE" ]; then
            echo "DART_API_KEY GitHub Actions secret is configured."
          else
            echo "DART_API_KEY GitHub Actions secret is not configured; DART calendar collection will be skipped unless a GCP Secret Manager secret exists."
          fi
          if [ -n "$FMP_API_KEY_VALUE" ]; then
            echo "FMP_API_KEY GitHub Actions secret is configured."
          else
            echo "FMP_API_KEY GitHub Actions secret is not configured; Nasdaq FMP estimates will be skipped unless a GCP Secret Manager secret exists."
          fi
          if [ -n "$YAHOO_COOKIE_VALUE" ] && [ -n "$YAHOO_CRUMB_VALUE" ]; then
            echo "YAHOO_COOKIE/YAHOO_CRUMB GitHub Actions secrets are configured."
          else
            echo "YAHOO_COOKIE/YAHOO_CRUMB secrets are not configured; Yahoo will try DB cache and live session minting."
          fi
          echo "Seeking Alpha Nasdaq estimates use public JSON by default; optional SEEKING_ALPHA_COOKIE Secret Manager secret is only needed if Cloud Run gets blocked."

      - name: Build & push images
        run: |
          APP_IMG="${REGION}-docker.pkg.dev/${PROJECT}/cloud-run-source-deploy/${SERVICE}:${GITHUB_SHA::12}"
          JOB_IMG="${REGION}-docker.pkg.dev/${PROJECT}/cloud-run-source-deploy/${JOB}:${GITHUB_SHA::12}"
          echo "APP_IMG=$APP_IMG" >> "$GITHUB_ENV"
          echo "JOB_IMG=$JOB_IMG" >> "$GITHUB_ENV"
          gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet
          docker build --target runner -t "$APP_IMG" butler
          docker build --target worker -t "$JOB_IMG" butler
          docker push "$APP_IMG"
          docker push "$JOB_IMG"

      - name: Deploy service
        run: |
          CONNECTION="${PROJECT}:${REGION}:${SQL_INSTANCE}"
          SECRET_VARS="PGPASSWORD=${DB_PASSWORD_SECRET}:latest"
          if gcloud secrets describe BUTLER_TELEGRAM_BOT_TOKEN --project "$PROJECT" >/dev/null 2>&1; then
            SECRET_VARS="${SECRET_VARS},BUTLER_TELEGRAM_BOT_TOKEN=BUTLER_TELEGRAM_BOT_TOKEN:latest"
          fi
          if gcloud secrets describe BUTLER_TELEGRAM_WEBHOOK_SECRET --project "$PROJECT" >/dev/null 2>&1; then
            SECRET_VARS="${SECRET_VARS},BUTLER_TELEGRAM_WEBHOOK_SECRET=BUTLER_TELEGRAM_WEBHOOK_SECRET:latest"
          fi
          if gcloud secrets describe DART_API_KEY --project "$PROJECT" >/dev/null 2>&1; then
            SECRET_VARS="${SECRET_VARS},DART_API_KEY=DART_API_KEY:latest"
          fi
          if gcloud secrets describe FMP_API_KEY --project "$PROJECT" >/dev/null 2>&1; then
            SECRET_VARS="${SECRET_VARS},FMP_API_KEY=FMP_API_KEY:latest"
          fi
          if gcloud secrets describe SEEKING_ALPHA_COOKIE --project "$PROJECT" >/dev/null 2>&1; then
            SECRET_VARS="${SECRET_VARS},SEEKING_ALPHA_COOKIE=SEEKING_ALPHA_COOKIE:latest"
          fi

          gcloud run deploy "$SERVICE" \
            --image "$APP_IMG" --project "$PROJECT" --region "$REGION" \
            --allow-unauthenticated --memory 512Mi --cpu 1 \
            --min-instances 0 --max-instances 2 --port 8080 \
            --service-account "${RUN_SA}@${PROJECT}.iam.gserviceaccount.com" \
            --set-cloudsql-instances "$CONNECTION" \
            --set-env-vars "PGHOST=/cloudsql/${CONNECTION},PGDATABASE=${DB_NAME},PGUSER=${DB_USER},BUTLER_BASE_URL=${URL},BUTLER_RATE_PER_MIN=80,SEEKING_ALPHA_NASDAQ_LIMIT=${SEEKING_ALPHA_NASDAQ_LIMIT},SEEKING_ALPHA_BATCH_SIZE=${SEEKING_ALPHA_BATCH_SIZE},SEEKING_ALPHA_CALL_DELAY_MS=${SEEKING_ALPHA_CALL_DELAY_MS},SEEKING_ALPHA_USE_CURL=${SEEKING_ALPHA_USE_CURL},STOCKANALYSIS_NASDAQ_LIMIT=${STOCKANALYSIS_NASDAQ_LIMIT},STOCKANALYSIS_CALL_DELAY_MS=${STOCKANALYSIS_CALL_DELAY_MS},STOCKANALYSIS_JITTER_MS=${STOCKANALYSIS_JITTER_MS},STOCKANALYSIS_BROKER_TARGETS=${STOCKANALYSIS_BROKER_TARGETS}" \
            --set-secrets "$SECRET_VARS"

      - name: Update refresh job image
        env:
          DART_API_KEY_VALUE: ${{ secrets.DART_API_KEY }}
          FMP_API_KEY_VALUE: ${{ secrets.FMP_API_KEY }}
          YAHOO_COOKIE_VALUE: ${{ secrets.YAHOO_COOKIE }}
          YAHOO_CRUMB_VALUE: ${{ secrets.YAHOO_CRUMB }}
        run: |
          CONNECTION="${PROJECT}:${REGION}:${SQL_INSTANCE}"
          SECRET_VARS="PGPASSWORD=${DB_PASSWORD_SECRET}:latest"
          ENV_VARS="PGHOST=/cloudsql/${CONNECTION},PGDATABASE=${DB_NAME},PGUSER=${DB_USER},BUTLER_BASE_URL=${URL},BUTLER_RATE_PER_MIN=80,SEEKING_ALPHA_NASDAQ_LIMIT=${SEEKING_ALPHA_NASDAQ_LIMIT},SEEKING_ALPHA_BATCH_SIZE=${SEEKING_ALPHA_BATCH_SIZE},SEEKING_ALPHA_CALL_DELAY_MS=${SEEKING_ALPHA_CALL_DELAY_MS},SEEKING_ALPHA_USE_CURL=${SEEKING_ALPHA_USE_CURL},STOCKANALYSIS_NASDAQ_LIMIT=${STOCKANALYSIS_NASDAQ_LIMIT},STOCKANALYSIS_CALL_DELAY_MS=${STOCKANALYSIS_CALL_DELAY_MS},STOCKANALYSIS_JITTER_MS=${STOCKANALYSIS_JITTER_MS},STOCKANALYSIS_BROKER_TARGETS=${STOCKANALYSIS_BROKER_TARGETS}"
          if gcloud secrets describe BUTLER_TELEGRAM_BOT_TOKEN --project "$PROJECT" >/dev/null 2>&1; then
            SECRET_VARS="${SECRET_VARS},BUTLER_TELEGRAM_BOT_TOKEN=BUTLER_TELEGRAM_BOT_TOKEN:latest"
          fi
          if gcloud secrets describe DART_API_KEY --project "$PROJECT" >/dev/null 2>&1; then
            SECRET_VARS="${SECRET_VARS},DART_API_KEY=DART_API_KEY:latest"
          elif [ -n "$DART_API_KEY_VALUE" ]; then
            ENV_VARS="${ENV_VARS},DART_API_KEY=${DART_API_KEY_VALUE}"
          fi
          if gcloud secrets describe FMP_API_KEY --project "$PROJECT" >/dev/null 2>&1; then
            SECRET_VARS="${SECRET_VARS},FMP_API_KEY=FMP_API_KEY:latest"
          elif [ -n "$FMP_API_KEY_VALUE" ]; then
            ENV_VARS="${ENV_VARS},FMP_API_KEY=${FMP_API_KEY_VALUE}"
          fi
          if gcloud secrets describe YAHOO_COOKIE --project "$PROJECT" >/dev/null 2>&1; then
            SECRET_VARS="${SECRET_VARS},YAHOO_COOKIE=YAHOO_COOKIE:latest"
          elif [ -n "$YAHOO_COOKIE_VALUE" ]; then
            ENV_VARS="${ENV_VARS},YAHOO_COOKIE=${YAHOO_COOKIE_VALUE}"
          fi
          if gcloud secrets describe YAHOO_CRUMB --project "$PROJECT" >/dev/null 2>&1; then
            SECRET_VARS="${SECRET_VARS},YAHOO_CRUMB=YAHOO_CRUMB:latest"
          elif [ -n "$YAHOO_CRUMB_VALUE" ]; then
            ENV_VARS="${ENV_VARS},YAHOO_CRUMB=${YAHOO_CRUMB_VALUE}"
          fi
          if gcloud secrets describe SEEKING_ALPHA_COOKIE --project "$PROJECT" >/dev/null 2>&1; then
            SECRET_VARS="${SECRET_VARS},SEEKING_ALPHA_COOKIE=SEEKING_ALPHA_COOKIE:latest"
          fi

          if gcloud run jobs describe "$JOB" --region "$REGION" --project "$PROJECT" >/dev/null 2>&1; then
            JOB_CMD=(gcloud run jobs update "$JOB")
          else
            JOB_CMD=(gcloud run jobs create "$JOB")
          fi

          "${JOB_CMD[@]}" \
            --image "$JOB_IMG" --project "$PROJECT" --region "$REGION" \
            --command npx --args tsx,scripts/refresh-daily.ts,--no-stockanalysis-nasdaq-estimates \
            --memory 512Mi --cpu 1 --tasks 1 --parallelism 1 \
            --max-retries 0 --task-timeout 7200 \
            --service-account "${RUN_SA}@${PROJECT}.iam.gserviceaccount.com" \
            --set-cloudsql-instances "$CONNECTION" \
            --set-env-vars "$ENV_VARS" \
            --set-secrets "$SECRET_VARS"

      - name: Update StockAnalysis backfill job
        run: |
          CONNECTION="${PROJECT}:${REGION}:${SQL_INSTANCE}"
          SECRET_VARS="PGPASSWORD=${DB_PASSWORD_SECRET}:latest"
          ENV_VARS="PGHOST=/cloudsql/${CONNECTION},PGDATABASE=${DB_NAME},PGUSER=${DB_USER},BUTLER_BASE_URL=${URL},BUTLER_RATE_PER_MIN=80,STOCKANALYSIS_NASDAQ_LIMIT=${STOCKANALYSIS_NASDAQ_LIMIT},STOCKANALYSIS_CALL_DELAY_MS=${STOCKANALYSIS_CALL_DELAY_MS},STOCKANALYSIS_JITTER_MS=${STOCKANALYSIS_JITTER_MS},STOCKANALYSIS_BROKER_TARGETS=${STOCKANALYSIS_BROKER_TARGETS}"

          if gcloud run jobs describe "$STOCKANALYSIS_JOB" --region "$REGION" --project "$PROJECT" >/dev/null 2>&1; then
            JOB_CMD=(gcloud run jobs update "$STOCKANALYSIS_JOB")
          else
            JOB_CMD=(gcloud run jobs create "$STOCKANALYSIS_JOB")
          fi

          "${JOB_CMD[@]}" \
            --image "$JOB_IMG" --project "$PROJECT" --region "$REGION" \
            --command npx --args tsx,scripts/backfill-stockanalysis-nasdaq-estimates.ts \
            --memory 512Mi --cpu 1 --tasks 1 --parallelism 1 \
            --max-retries 0 --task-timeout 1800 \
            --service-account "${RUN_SA}@${PROJECT}.iam.gserviceaccount.com" \
            --set-cloudsql-instances "$CONNECTION" \
            --set-env-vars "$ENV_VARS" \
            --set-secrets "$SECRET_VARS"

      - name: Update StockAnalysis backfill scheduler
        run: |
          SCHEDULER_URI="https://${REGION}-run.googleapis.com/apis/run.googleapis.com/v1/namespaces/${PROJECT}/jobs/${STOCKANALYSIS_JOB}:run"
          if gcloud scheduler jobs describe "$STOCKANALYSIS_SCHEDULER_JOB" --location "$REGION" --project "$PROJECT" >/dev/null 2>&1; then
            SCHED_CMD=(gcloud scheduler jobs update http "$STOCKANALYSIS_SCHEDULER_JOB")
          else
            SCHED_CMD=(gcloud scheduler jobs create http "$STOCKANALYSIS_SCHEDULER_JOB")
          fi

          set +e
          "${SCHED_CMD[@]}" \
            --project "$PROJECT" \
            --location "$REGION" \
            --schedule "10 2,8,14,20 * * *" \
            --time-zone "Asia/Seoul" \
            --uri "$SCHEDULER_URI" \
            --http-method POST \
            --oauth-service-account-email "${RUN_SA}@${PROJECT}.iam.gserviceaccount.com" \
            --oauth-token-scope "https://www.googleapis.com/auth/cloud-platform" \
            --attempt-deadline 60s \
            --max-retry-attempts 0
          SCHED_STATUS=$?
          set -e
          if [ "$SCHED_STATUS" -ne 0 ]; then
            echo "::warning::Cloud Scheduler sync skipped. Grant roles/cloudscheduler.admin to the deploy service account to manage ${STOCKANALYSIS_SCHEDULER_JOB}; GitHub Actions still runs the StockAnalysis cron."
          fi

      - name: Update daily refresh scheduler
        run: |
          SCHEDULER_URI="https://${REGION}-run.googleapis.com/apis/run.googleapis.com/v1/namespaces/${PROJECT}/jobs/${JOB}:run"
          if gcloud scheduler jobs describe "$SCHEDULER_JOB" --location "$REGION" --project "$PROJECT" >/dev/null 2>&1; then
            SCHED_CMD=(gcloud scheduler jobs update http "$SCHEDULER_JOB")
          else
            SCHED_CMD=(gcloud scheduler jobs create http "$SCHEDULER_JOB")
          fi

          set +e
          "${SCHED_CMD[@]}" \
            --project "$PROJECT" \
            --location "$REGION" \
            --schedule "30 18 * * *" \
            --time-zone "Asia/Seoul" \
            --uri "$SCHEDULER_URI" \
            --http-method POST \
            --oauth-service-account-email "${RUN_SA}@${PROJECT}.iam.gserviceaccount.com" \
            --oauth-token-scope "https://www.googleapis.com/auth/cloud-platform" \
            --attempt-deadline 60s \
            --max-retry-attempts 1
          SCHED_STATUS=$?
          set -e
          if [ "$SCHED_STATUS" -ne 0 ]; then
            echo "::warning::Cloud Scheduler sync skipped. Grant roles/cloudscheduler.admin to the deploy service account to manage ${SCHEDULER_JOB}; GitHub Actions still runs the daily refresh cron."
          fi

      - name: Update weekly calendar job
        env:
          DART_API_KEY_VALUE: ${{ secrets.DART_API_KEY }}
          FMP_API_KEY_VALUE: ${{ secrets.FMP_API_KEY }}
        run: |
          CONNECTION="${PROJECT}:${REGION}:${SQL_INSTANCE}"
          SECRET_VARS="PGPASSWORD=${DB_PASSWORD_SECRET}:latest"
          ENV_VARS="PGHOST=/cloudsql/${CONNECTION},PGDATABASE=${DB_NAME},PGUSER=${DB_USER},BUTLER_BASE_URL=${URL},BUTLER_RATE_PER_MIN=80,SEEKING_ALPHA_NASDAQ_LIMIT=${SEEKING_ALPHA_NASDAQ_LIMIT},SEEKING_ALPHA_BATCH_SIZE=${SEEKING_ALPHA_BATCH_SIZE},SEEKING_ALPHA_CALL_DELAY_MS=${SEEKING_ALPHA_CALL_DELAY_MS},SEEKING_ALPHA_USE_CURL=${SEEKING_ALPHA_USE_CURL},STOCKANALYSIS_NASDAQ_LIMIT=${STOCKANALYSIS_NASDAQ_LIMIT},STOCKANALYSIS_CALL_DELAY_MS=${STOCKANALYSIS_CALL_DELAY_MS},STOCKANALYSIS_JITTER_MS=${STOCKANALYSIS_JITTER_MS},STOCKANALYSIS_BROKER_TARGETS=${STOCKANALYSIS_BROKER_TARGETS}"
          if gcloud secrets describe DART_API_KEY --project "$PROJECT" >/dev/null 2>&1; then
            SECRET_VARS="${SECRET_VARS},DART_API_KEY=DART_API_KEY:latest"
          elif [ -n "$DART_API_KEY_VALUE" ]; then
            ENV_VARS="${ENV_VARS},DART_API_KEY=${DART_API_KEY_VALUE}"
          fi
          if gcloud secrets describe FMP_API_KEY --project "$PROJECT" >/dev/null 2>&1; then
            SECRET_VARS="${SECRET_VARS},FMP_API_KEY=FMP_API_KEY:latest"
          elif [ -n "$FMP_API_KEY_VALUE" ]; then
            ENV_VARS="${ENV_VARS},FMP_API_KEY=${FMP_API_KEY_VALUE}"
          fi
          if gcloud secrets describe SEEKING_ALPHA_COOKIE --project "$PROJECT" >/dev/null 2>&1; then
            SECRET_VARS="${SECRET_VARS},SEEKING_ALPHA_COOKIE=SEEKING_ALPHA_COOKIE:latest"
          fi

          if gcloud run jobs describe "$CALENDAR_JOB" --region "$REGION" --project "$PROJECT" >/dev/null 2>&1; then
            JOB_CMD=(gcloud run jobs update "$CALENDAR_JOB")
          else
            JOB_CMD=(gcloud run jobs create "$CALENDAR_JOB")
          fi

          "${JOB_CMD[@]}" \
            --image "$JOB_IMG" --project "$PROJECT" --region "$REGION" \
            --command npx --args tsx,scripts/refresh-daily.ts,--calendar-only \
            --memory 512Mi --cpu 1 --tasks 1 --parallelism 1 \
            --max-retries 0 --task-timeout 7200 \
            --service-account "${RUN_SA}@${PROJECT}.iam.gserviceaccount.com" \
            --set-cloudsql-instances "$CONNECTION" \
            --set-env-vars "$ENV_VARS" \
            --set-secrets "$SECRET_VARS"

      - name: Update weekly calendar scheduler
        run: |
          SCHEDULER_URI="https://${REGION}-run.googleapis.com/apis/run.googleapis.com/v1/namespaces/${PROJECT}/jobs/${CALENDAR_JOB}:run"
          if gcloud scheduler jobs describe "$CALENDAR_SCHEDULER_JOB" --location "$REGION" --project "$PROJECT" >/dev/null 2>&1; then
            SCHED_CMD=(gcloud scheduler jobs update http "$CALENDAR_SCHEDULER_JOB")
          else
            SCHED_CMD=(gcloud scheduler jobs create http "$CALENDAR_SCHEDULER_JOB")
          fi

          set +e
          "${SCHED_CMD[@]}" \
            --project "$PROJECT" \
            --location "$REGION" \
            --schedule "0 8 * * 6" \
            --time-zone "Asia/Seoul" \
            --uri "$SCHEDULER_URI" \
            --http-method POST \
            --oauth-service-account-email "${RUN_SA}@${PROJECT}.iam.gserviceaccount.com" \
            --oauth-token-scope "https://www.googleapis.com/auth/cloud-platform" \
            --attempt-deadline 60s \
            --max-retry-attempts 1
          SCHED_STATUS=$?
          set -e
          if [ "$SCHED_STATUS" -ne 0 ]; then
            echo "::warning::Cloud Scheduler sync skipped. Grant roles/cloudscheduler.admin to the deploy service account to manage ${CALENDAR_SCHEDULER_JOB}; GitHub Actions still runs the weekly calendar cron."
          fi

      - name: Verify
        run: |
          sleep 5
          curl -s -m 25 "${URL}/api/stats" | head -c 300 || true
